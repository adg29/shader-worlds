<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Worlds - Drafts</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #050506; color: #f4f4f2; font-family: ui-sans-serif, system-ui, sans-serif; }
    #feed {
      height: 100dvh;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      touch-action: pan-y;
    }
    .slide { position: relative; height: 100dvh; scroll-snap-align: start; overflow: hidden; }
    .world, canvas.gl { position: absolute; inset: 0; }
    canvas.gl { width: 100%; height: 100%; display: block; pointer-events: none; }
    img.still { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
    .caption {
      position: absolute;
      left: 1.15rem;
      bottom: calc(1.15rem + env(safe-area-inset-bottom, 0px));
      z-index: 1;
      font-size: 1.05rem;
      font-weight: 560;
      text-shadow: 0 1px 10px #000;
    }
    .draft-chip {
      position: absolute;
      top: 1.15rem;
      right: 1.15rem;
      z-index: 1;
      padding: 0.35rem 0.65rem;
      background: rgba(255, 150, 0, 0.90);
      color: #050506;
      font-size: 0.70rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-radius: 0.25rem;
      text-shadow: none;
      backdrop-filter: blur(8px);
    }
    .promote {
      position: absolute;
      right: 1.15rem;
      bottom: calc(1.15rem + env(safe-area-inset-bottom, 0px));
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.4rem;
      pointer-events: auto;
    }
    .promote button {
      appearance: none;
      border: 0;
      cursor: pointer;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 650;
      letter-spacing: 0.03em;
      padding: 0.48rem 0.78rem;
      border-radius: 999px;
      color: #050506;
      background: #f4f4f2;
    }
    .promote button.ghost {
      background: rgba(5, 5, 6, 0.72);
      color: #f4f4f2;
      backdrop-filter: blur(10px);
    }
    .promote button.danger {
      background: #f4f4f2;
    }
    .promote .ask {
      display: none;
      max-width: 11.5rem;
      text-align: right;
      font-size: 0.72rem;
      line-height: 1.35;
      color: rgba(244, 244, 242, 0.88);
      text-shadow: 0 1px 8px #000;
    }
    .promote[data-state="confirm"] .ask { display: block; }
    .promote[data-state="idle"] [data-act="keep"],
    .promote[data-state="idle"] [data-act="publish"] { display: none; }
    .promote[data-state="confirm"] [data-act="go"] { display: none; }
    .promote[data-state="queued"] [data-act="go"],
    .promote[data-state="queued"] [data-act="keep"],
    .promote[data-state="queued"] [data-act="publish"] { display: none; }
    .promote[data-state="queued"] .ask { display: block; }
    .slide[data-promote="queued"] .draft-chip {
      background: rgba(244, 244, 242, 0.92);
    }
    .notes {
      position: absolute;
      left: 1.15rem;
      top: 1.15rem;
      z-index: 1;
      max-width: 22rem;
      padding: 0.55rem 0.75rem;
      background: rgba(5, 5, 6, 0.75);
      backdrop-filter: blur(12px);
      border-radius: 0.35rem;
      font-size: 0.75rem;
      line-height: 1.45;
      color: rgba(244, 244, 242, 0.85);
    }
    .notes .note-item {
      margin-bottom: 0.40rem;
    }
    .notes .note-item:last-child {
      margin-bottom: 0;
    }
    .notes .note-date {
      font-size: 0.68rem;
      color: rgba(244, 244, 242, 0.55);
      font-weight: 600;
      margin-right: 0.35rem;
    }
    #molten .world {
      background:
        repeating-linear-gradient(18deg, transparent 0 46px, rgba(255,70,0,.55) 47px, transparent 49px),
        repeating-linear-gradient(-28deg, transparent 0 72px, rgba(255,120,20,.35) 73px, transparent 76px),
        radial-gradient(ellipse 50% 28% at 32% 68%, #ff4d00, transparent 60%),
        radial-gradient(ellipse 36% 22% at 74% 38%, #ff2a00, transparent 55%),
        linear-gradient(160deg, #070504, #140a08 50%, #050403);
    }
    #aurora .world {
      background:
        radial-gradient(ellipse 90% 42% at 50% 18%, rgba(56,255,150,.5), transparent 62%),
        radial-gradient(ellipse 55% 34% at 22% 36%, rgba(170,70,255,.4), transparent 58%),
        radial-gradient(ellipse 48% 28% at 78% 30%, rgba(20,220,190,.32), transparent 55%),
        linear-gradient(#02040c, #061018 58%, #020308);
    }
    #caustics .world {
      background:
        repeating-radial-gradient(ellipse at 40% 0%, rgba(90,255,230,.28) 0 2px, transparent 18px 46px),
        radial-gradient(ellipse 70% 50% at 50% -10%, rgba(40,220,255,.35), transparent 60%),
        linear-gradient(#021018, #034 55%, #01202a);
    }
    #oil-film .world {
      background:
        conic-gradient(from 210deg at 60% 40%, #1a0033, #004466, #2a0044, #003322, #220033, #1a0033),
        radial-gradient(circle at 30% 70%, rgba(255,80,200,.35), transparent 40%),
        linear-gradient(#04050a, #0a0810);
      background-blend-mode: screen, screen, normal;
    }
    #curl-trap .world {
      background:
        radial-gradient(ellipse 70% 40% at 38% 62%, rgba(255,40,160,.55), transparent 58%),
        radial-gradient(ellipse 50% 32% at 68% 28%, rgba(255,190,40,.35), transparent 55%),
        linear-gradient(#14080c, #1a0610 55%, #0a0408);
    }
    #letter-orbit .world {
      background: radial-gradient(ellipse 70% 55% at 50% 48%, #d2d0cc, #b8b6b2 70%);
    }
    #heatmap .world {
      background:
        repeating-linear-gradient(90deg, transparent 0 28px, rgba(0,255,220,.22) 28px 29px),
        repeating-linear-gradient(0deg, transparent 0 22px, rgba(0,255,220,.16) 22px 23px),
        radial-gradient(ellipse 40% 30% at 55% 48%, rgba(255,80,40,.55), transparent 55%),
        radial-gradient(ellipse 28% 18% at 72% 40%, rgba(255,200,40,.4), transparent 50%),
        linear-gradient(#021014, #041820);
    }
    #ray-globe .world {
      background:
        radial-gradient(ellipse 60% 45% at 50% 35%, rgba(80,150,255,.45), transparent 65%),
        radial-gradient(ellipse 35% 25% at 50% 30%, rgba(160,200,255,.65), transparent 50%),
        radial-gradient(ellipse 100% 80% at 50% 50%, rgba(20,40,80,.85), transparent 70%),
        linear-gradient(#020408, #030610);
    }
  </style>
</head>
<body>
  <main id="feed">
    <section class="slide" id="molten"><div class="world"></div><canvas class="gl" data-world="molten"></canvas><div class="caption">Molten</div></section>
    <section class="slide" id="aurora"><div class="world"></div><canvas class="gl" data-world="aurora"></canvas><div class="caption">Aurora Field</div></section>
    <section class="slide" id="caustics"><div class="world"></div><canvas class="gl" data-world="caustics"></canvas><div class="caption">Deep-water caustics</div></section>
    <section class="slide" id="oil-film"><div class="world"></div><canvas class="gl" data-world="oil-film"></canvas><div class="caption">oil-film</div></section>
    <section class="slide" id="curl-trap"><div class="world"></div><canvas class="gl" data-world="curl-trap"></canvas><div class="caption">Hot Marble</div></section>
    <section class="slide" id="letter-orbit"><div class="world"></div><canvas class="gl" data-world="letter-orbit"></canvas><div class="caption">Walking Heat</div></section>
    <section class="slide" id="heatmap"><div class="world"></div><canvas class="gl" data-world="heatmap"></canvas><div class="caption">city activity heatmap</div></section>
    <section class="slide" id="ray-globe"><div class="draft-chip">Draft</div><div class="world"></div><canvas class="gl" data-world="ray-globe"></canvas><div class="caption">Ray Globe</div></section>
  </main>
  <script>
    (async () => {
      const KEY = "sw-promote-queue";
      const queue = (() => {
        try { return JSON.parse(localStorage.getItem(KEY) || "[]"); }
        catch (e) { return []; }
      })();
      const save = () => localStorage.setItem(KEY, JSON.stringify(queue));

      function setState(slide, state) {
        const bar = slide.querySelector(".promote");
        if (!bar) return;
        bar.dataset.state = state;
        slide.dataset.promote = state;
        const ask = bar.querySelector(".ask");
        const go = bar.querySelector('[data-act="go"]');
        if (state === "idle") {
          ask.textContent = "";
          go.textContent = "Promote";
        } else if (state === "confirm") {
          ask.textContent = "Publish to the public swipe?";
        } else if (state === "queued") {
          ask.textContent = "Queued for the wall";
        }
      }

      function mountPromote(slide, world) {
        if (slide.querySelector(".promote")) return;
        const bar = document.createElement("div");
        bar.className = "promote";
        bar.dataset.state = "idle";
        const ask = document.createElement("div");
        ask.className = "ask";
        const go = document.createElement("button");
        go.type = "button";
        go.dataset.act = "go";
        go.textContent = "Promote";
        const keep = document.createElement("button");
        keep.type = "button";
        keep.className = "ghost";
        keep.dataset.act = "keep";
        keep.textContent = "Keep draft";
        const pub = document.createElement("button");
        pub.type = "button";
        pub.dataset.act = "publish";
        pub.textContent = "Publish";
        bar.appendChild(ask);
        bar.appendChild(keep);
        bar.appendChild(pub);
        bar.appendChild(go);
        slide.appendChild(bar);
        go.addEventListener("click", function (e) {
          e.stopPropagation();
          setState(slide, "confirm");
        });
        keep.addEventListener("click", function (e) {
          e.stopPropagation();
          setState(slide, "idle");
        });
        pub.addEventListener("click", function (e) {
          e.stopPropagation();
          if (queue.indexOf(world.id) < 0) queue.push(world.id);
          save();
          setState(slide, "queued");
          if (history.replaceState) {
            history.replaceState(null, "", "#promote=" + encodeURIComponent(world.id));
          } else {
            location.hash = "promote=" + encodeURIComponent(world.id);
          }
        });
        if (queue.indexOf(world.id) >= 0) setState(slide, "queued");
      }

      try {
        const resp = await fetch("gallery.json");
        const gallery = await resp.json();
        gallery.worlds.forEach(function (world) {
          const slide = document.getElementById(world.id);
          if (!slide) return;
          if (world.notes && world.notes.length) {
            const notesDiv = document.createElement("div");
            notesDiv.className = "notes";
            world.notes.forEach(function (note) {
              const noteItem = document.createElement("div");
              noteItem.className = "note-item";
              const d = document.createElement("span");
              d.className = "note-date";
              d.textContent = note.at || "";
              const x = document.createElement("span");
              x.className = "note-text";
              x.textContent = note.text || "";
              noteItem.appendChild(d);
              noteItem.appendChild(x);
              notesDiv.appendChild(noteItem);
            });
            slide.appendChild(notesDiv);
          }
          if (world.status === "draft") mountPromote(slide, world);
        });
      } catch (err) {
        console.error("Failed to load gallery:", err);
      }
    })();
  </script>
  <script src="worlds.js"></script>
</body>
</html>
